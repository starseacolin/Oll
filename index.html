       // 沿实际运动轨迹回采样，旧尾迹比靠近粒子的部分更淡。
       for(let segment=0;segment<8;segment++){
        const a=start+(end-start)*segment/8,b=start+(end-start)*(segment+1)/8;
        const from=tapOffset(speck.motion,a),to=tapOffset(speck.motion,b);
        ctx.globalAlpha=.65*Math.max(0,1-b/speck.life)*Math.max(0,1-(tap.age-b)/tailDuration);
        ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();
       }
       if(tap.age<speck.life){
        const position=tapOffset(speck.motion,tap.age);
        ctx.globalAlpha=.85*(1-tap.age/speck.life);ctx.beginPath();ctx.arc(position.x,position.y,speck.size,0,Math.PI*2);ctx.fill();
       }
      }
     }else if(tap.kind==='square'||tap.kind==='diamond'){
      ctx.save();ctx.rotate(tap.kind==='diamond'?Math.PI/4:tap.rotation);ctx.strokeRect(-size/2,-size/2,size,size);ctx.restore();
     }else if(tap.kind==='spark'){
      for(let n=0;n<4;n++){const a=n*Math.PI/2;ctx.moveTo(Math.cos(a)*size*.35,Math.sin(a)*size*.35);ctx.lineTo(Math.cos(a)*size,Math.sin(a)*size);}ctx.stroke();
     }else{
      ctx.arc(0,0,size,0,Math.PI*2);ctx.stroke();
      if(tap.kind==='ripple'){ctx.globalAlpha*=.5;ctx.beginPath();ctx.arc(0,0,size*.65,0,Math.PI*2);ctx.stroke();}
     }
     ctx.restore();
    }
   }
   let press=null;
   const blocked=target=>target?.closest?.('a,button,input,textarea,select,label,.game-card,.details,.detail-summary,.breadcrumb');
   document.addEventListener('pointerdown',event=>{
    if(event.isPrimary===false||event.button!==0||blocked(event.target)){press=null;return;}
    press={id:event.pointerId,x:event.clientX,y:event.clientY,scroll:window.scrollY||0,time:event.timeStamp};
   },{signal,passive:true});
   document.addEventListener('pointermove',event=>{
    if(press&&event.pointerId===press.id&&Math.hypot(event.clientX-press.x,event.clientY-press.y)>10)press=null;
   },{signal,passive:true});
   document.addEventListener('pointercancel',()=>{press=null;},{signal,passive:true});
   document.addEventListener('pointerup',event=>{
    const start=press;press=null;
    if(!start||event.pointerId!==start.id||blocked(event.target)||event.timeStamp-start.time>500||Math.hypot(event.clientX-start.x,event.clientY-start.y)>10||Math.abs((window.scrollY||0)-start.scroll)>5||reduced.matches)return;
    taps.push(createTap(event.clientX,event.clientY));
    if(taps.length>8)taps.shift();
   },{signal,passive:true});
   function draw(dt,prewarm=false){
    time+=dt;
    trails.globalCompositeOperation='destination-out';trails.globalAlpha=1-Math.exp(-dt*.48);trails.fillStyle='#000';trails.fillRect(0,0,width,height);
    trails.globalCompositeOperation='source-over';
    if(!prewarm)drawPens(dt);
    trails.globalAlpha=1;
    ctx.clearRect(0,0,width,height);
    ctx.drawImage(trailCanvas,0,0,width,height);
    if(!prewarm)drawRunners(dt);
    for(const s of shapes){
     s.x+=s.vx*dt;s.y+=s.vy*dt;s.rotation+=s.spin*dt;
     if(s.x<-s.size)s.x=width+s.size;else if(s.x>width+s.size)s.x=-s.size;
     if(s.y<-s.size)s.y=height+s.size;else if(s.y>height+s.size)s.y=-s.size;
     ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rotation);ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=1.5;ctx.globalAlpha=.52;ctx.beginPath();
     if(s.kind==='square')ctx.rect(-s.size/2,-s.size/2,s.size,s.size);
     else if(s.kind==='triangle'){ctx.moveTo(0,-s.size);ctx.lineTo(s.size*.86,s.size*.5);ctx.lineTo(-s.size*.86,s.size*.5);ctx.closePath();}
     else ctx.arc(0,0,s.size,0,Math.PI*2);
     ctx.stroke();ctx.globalAlpha=.045;ctx.fill();ctx.restore();
    }
    if(!prewarm)drawTaps(dt);
   }
   function tick(now){
    frame=0;
    if(document.hidden||reduced.matches)return;
    // 目标 60 帧；独立绘制时刻避免累计计时误差导致额外跳帧。
    if(!last){last=now;nextDraw=now+1000/60;}
    if(now+.5>=nextDraw){
     draw(Math.min((now-last)/1000,.065));last=now;
     nextDraw+=1000/60;
     if(nextDraw<=now)nextDraw=now+1000/60;
    }
    frame=requestAnimationFrame(tick);
   }
   function sync(){
    cancelAnimationFrame(frame);frame=0;last=0;nextDraw=0;
    const paused=reduced.matches;
    if(!paused&&!document.hidden)frame=requestAnimationFrame(tick);
   }
   setup();sync();
   document.addEventListener('visibilitychange',sync,{signal});
   reduced.addEventListener('change',sync,{signal});
   window.addEventListener('resize',resizeBackground,{signal});
  }
 }
}
